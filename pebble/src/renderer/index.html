<!doctype html>
<html lang="en">

    <title>Selene Pebble</title>
    <link rel="stylesheet" href="./pebble.css">
  </head>
  <body class="pebble-native-transparent">
    <main id="pebble-root">

    </main>
    <script src="./pebble.js"></script>
