<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selene Setup</title>
    <link rel="stylesheet" href="./setup.css">
  </head>
  <body>
    <main class="setup-shell">
      <aside class="setup-rail">
        <div>
          <p class="eyebrow">Selene</p>
          <h1>Setup v1</h1>
        </div>
        <ol id="step-list" class="step-list"></ol>
      </aside>
      <section class="setup-panel">
        <header class="setup-header">
          <div>
            <p id="progress" class="eyebrow">1 of 10</p>
            <h2 id="page-title">Meet Selene</h2>
          </div>
          <div id="status-pill" class="status-pill">draft</div>
        </header>
        <div id="page-content" class="page-content"></div>
        <footer class="setup-footer">
          <button type="button" id="back-button" class="ghost-button">Back</button>
          <button type="button" id="next-button" class="primary-button">Next</button>
        </footer>
      </section>
    </main>
    <script src="./setup.js"></script>
  </body>
</html>
