<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    >

    <title>Selene Panel</title>

    <link
      rel="stylesheet"
      href="./panel.css"
    >
  </head>

  <body>
    <main
      id="panel"
      class="panel panel--closed"
      data-state="idle"
      aria-label="Selene"
    >
      <header class="panel-header">
        <div class="panel-identity">
          <span class="panel-name">Selene</span>

          <span class="panel-status">
            <span
              class="panel-status-dot"
              aria-hidden="true"
            ></span>

            <span id="panel-status-text">
              Ready
            </span>
          </span>
        </div>

        <button
          type="button"
          id="close-panel"
          class="panel-close"
          aria-label="Close Selene"
          title="Close (Esc)"
        >
          ×
        </button>
      </header>

      <section
        id="conversation"
        class="conversation"
        aria-label="Conversation"
      >
        <div
          id="message-list"
          class="message-list"
          aria-live="polite"
        ></div>

        <div
          id="response-message"
          class="response-message"
          role="status"
          aria-live="polite"
        ></div>

        <div
          id="approval-card"
          class="approval-card"
          hidden
        ></div>

        <section
          id="pairing-card"
          class="pairing-card"
          aria-label="Device pairing"
        >
          <div class="pairing-header">
            <div>
              <h2>Device pairing</h2>
              <p id="pairing-message">Checking secure pairing…</p>
            </div>

            <span
              id="pairing-badge"
              class="pairing-badge"
            >
              Unavailable
            </span>
          </div>

          <div
            id="pairing-secret-wrap"
            class="pairing-secret-wrap"
            hidden
          >
            <span class="pairing-secret-label">Temporary secret</span>
            <code id="pairing-secret"></code>
            <span id="pairing-expiration"></span>
          </div>

          <div class="pairing-actions">
            <button
              type="button"
              id="pairing-start"
              class="pairing-button pairing-button--primary"
              disabled
            >
              Pair a Device
            </button>

            <button
              type="button"
              id="pairing-cancel"
              class="pairing-button"
              disabled
            >
              Cancel Pairing
            </button>
          </div>
        </section>
      </section>

      <div
        id="state-switcher"
        class="state-switcher"
        aria-label="Pebble state preview"
        hidden
      ></div>

      <div class="composer">
        <input
          id="nova-input"
          type="text"
          placeholder="Ask Selene..."
          autocomplete="off"
          spellcheck="false"
          aria-label="Ask Selene"
        >

        <button
          type="button"
          id="send-command"
          class="composer-send"
          aria-label="Send"
          title="Send"
        >
          <span aria-hidden="true">↑</span>
        </button>
      </div>
    </main>

    <script src="../shared/pairingPanelState.cjs"></script>
    <script src="./panel.js"></script>
  </body>
</html>
