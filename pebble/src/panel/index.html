<!doctype html>
<html lang="en" data-theme="obsidian">
  <head>
    <meta charset="UTF-8">
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    >

    <title>Selene Panel</title>

    <link
      rel="stylesheet"
      href="./panel.css"
    >
  </head>

  <body>
    <main
      id="panel"
      class="panel panel--closed"
      data-state="idle"
      aria-label="Selene"
    >
      <header class="panel-header">
        <div class="panel-identity">
          <span class="panel-brand-mark" aria-hidden="true"></span>

          <span class="panel-identity-copy">
            <span class="panel-name">Selene</span>

            <span
              id="panel-status"
              class="panel-status"
              aria-label="Idle: I'm here."
            >
              <span
                class="panel-status-dot"
                aria-hidden="true"
              ></span>

              <span id="panel-status-text">
                Idle
              </span>
            </span>
          </span>
        </div>

        <div class="panel-header-actions">
          <button
            type="button"
            id="header-menu-button"
            class="panel-menu-button"
            aria-label="Open Selene menu"
            aria-haspopup="menu"
            aria-expanded="false"
            aria-controls="header-menu"
            title="More options"
          >
            <span aria-hidden="true">•••</span>
          </button>

          <div
            id="header-menu"
            class="panel-menu"
            role="menu"
            aria-label="Selene options"
            hidden
          >
            <button
              type="button"
              class="panel-menu-item"
              role="menuitem"
              data-menu-action="devices-security"
            >
              Devices &amp; Security
            </button>

            <div class="panel-menu-separator" role="separator"></div>
            <span class="panel-menu-label" role="presentation">Appearance</span>

            <button
              type="button"
              class="panel-menu-item panel-menu-theme"
              role="menuitemradio"
              aria-checked="true"
              data-theme-choice="obsidian"
            >
              <span class="theme-swatch theme-swatch--obsidian" aria-hidden="true"></span>
              Obsidian
            </button>

            <button
              type="button"
              class="panel-menu-item panel-menu-theme"
              role="menuitemradio"
              aria-checked="false"
              data-theme-choice="ruby"
            >
              <span class="theme-swatch theme-swatch--ruby" aria-hidden="true"></span>
              Ruby
            </button>

            <button
              type="button"
              class="panel-menu-item panel-menu-theme"
              role="menuitemradio"
              aria-checked="false"
              data-theme-choice="sapphire"
            >
              <span class="theme-swatch theme-swatch--sapphire" aria-hidden="true"></span>
              Sapphire
            </button>
          </div>

          <button
            type="button"
            id="close-panel"
            class="panel-close"
            aria-label="Close Selene"
            title="Close (Esc)"
          >
            ×
          </button>
        </div>
      </header>

      <section
        id="chat-view"
        class="panel-view chat-view"
        aria-label="Chat"
      >
        <section
          id="conversation"
          class="conversation panel-scroll-region"
          aria-label="Conversation"
        >
          <div
            id="message-list"
            class="message-list"
            aria-live="polite"
          ></div>

          <div
            id="response-message"
            class="response-message"
            role="status"
            aria-live="polite"
          ></div>

          <div
            id="approval-card"
            class="approval-card"
            hidden
          ></div>
        </section>

        <div
          id="state-switcher"
          class="state-switcher"
          aria-label="Pebble state preview"
          hidden
        ></div>

        <div class="composer">
          <input
            id="nova-input"
            type="text"
            placeholder="Ask Selene..."
            autocomplete="off"
            spellcheck="false"
            aria-label="Ask Selene"
          >

          <button
            type="button"
            id="send-command"
            class="composer-send"
            aria-label="Send"
            title="Send"
          >
            <span aria-hidden="true">↑</span>
          </button>
        </div>
      </section>

      <section
        id="devices-security-view"
        class="panel-view devices-security-view panel-scroll-region"
        aria-labelledby="devices-security-heading"
        hidden
      >
        <div class="secondary-view-header">
          <button
            type="button"
            id="back-to-chat"
            class="secondary-view-back"
            aria-label="Back to Chat"
            title="Back to Chat"
          >
            <span aria-hidden="true">←</span>
            <span>Back to Chat</span>
          </button>

          <h1 id="devices-security-heading">Devices &amp; Security</h1>
        </div>

        <section
          id="pairing-card"
          class="pairing-card"
          aria-label="Device pairing"
        >
          <div class="pairing-header">
            <div>
              <h2>Device pairing</h2>
              <p id="pairing-message">Checking secure pairing…</p>
            </div>

            <span
              id="pairing-badge"
              class="pairing-badge"
            >
              Unavailable
            </span>
          </div>

          <div
            id="pairing-secret-wrap"
            class="pairing-secret-wrap"
            hidden
          >
            <span class="pairing-secret-label">Temporary secret</span>
            <code id="pairing-secret"></code>
            <span id="pairing-expiration"></span>
          </div>

          <div class="pairing-actions">
            <button
              type="button"
              id="pairing-secure-core"
              class="pairing-button pairing-button--primary"
              disabled
            >
              Start Secure Core
            </button>

            <button
              type="button"
              id="pairing-check"
              class="pairing-button"
            >
              Check Again
            </button>

            <button
              type="button"
              id="pairing-start"
              class="pairing-button pairing-button--primary"
              disabled
            >
              Pair a Device
            </button>

            <button
              type="button"
              id="pairing-cancel"
              class="pairing-button"
              disabled
            >
              Cancel Pairing
            </button>
          </div>
        </section>
      </section>
    </main>

    <script src="../shared/panelChromeState.cjs"></script>
    <script src="../shared/panelViewState.cjs"></script>
    <script src="../shared/pairingPanelState.cjs"></script>
    <script src="./panel.js"></script>
  </body>
</html>
