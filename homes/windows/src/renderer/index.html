
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Selene</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Segoe UI", sans-serif;
      background: #14141a;
      color: #e8e5f0;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #14141a;
    }

    .titlebar {
      height: 40px;
      display: flex;
      align-items: center;
      padding: 0 150px 0 18px;
      -webkit-app-region: drag;
      app-region: drag;
    }

    .titlebar span {
      font-size: 13px;
      font-weight: 600;
    }

    main {
      min-height: calc(100vh - 40px);
      display: grid;
      place-items: center;
    }

    .welcome {
      text-align: center;
    }

    .welcome h1 {
      font-size: 32px;
      font-weight: 500;
      margin-bottom: 8px;
    }

    .welcome p {
      color: #aaa6b8;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <header class="titlebar">
    <span>Selene</span>
  </header>

  <main>
    <div class="welcome">
      <h1>Selene</h1>
      <p>Windows Home v0.1</p>
    </div>
  </main>
</body>
</html>
